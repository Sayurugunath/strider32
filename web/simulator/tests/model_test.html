<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strider32 3D Robot Model Test Harness</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #e2e8f0;
            --border-color: #1e293b;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
        }

        body {
            font-family: 'JetBrains Mono', monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--cyan);
            font-size: 1.25rem;
            margin: 0;
        }

        .layout-container {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        .viewport-box {
            flex: 1;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        #canvasContainer {
            width: 100%;
            height: 100%;
        }

        .sidebar-box {
            width: 340px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            background-color: #1e293b;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-cyan { background-color: var(--cyan); color: #000; border: none; }
        .btn-emerald { background-color: var(--emerald); color: #000; border: none; }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .slider-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--cyan);
        }

        .fk-box {
            background-color: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.75rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>Strider32 3D Robot Model Verification Test</h1>
        <div>
            <label style="font-size: 0.8rem; cursor: pointer;">
                <input type="checkbox" id="axesToggle" checked onchange="RobotModel.toggleAxes(this.checked)"> Debug Axes Helper
            </label>
        </div>
    </header>

    <div class="layout-container">
        <div class="viewport-box">
            <div id="canvasContainer"></div>
        </div>

        <div class="sidebar-box">
            <div>
                <small style="color: #64748b; font-weight: bold;">STANCE PRESETS</small>
                <div class="btn-group" style="margin-top: 8px;">
                    <button class="btn btn-cyan" onclick="applyPreset('STAND')">Stand Stance</button>
                    <button class="btn" onclick="applyPreset('REST')">Rest Pose</button>
                    <button class="btn" onclick="applyPreset('SIT')">Sit Pose</button>
                    <button class="btn" onclick="applyPreset('WAVE')">Wave Pose</button>
                </div>
            </div>

            <div class="slider-group">
                <small style="color: #64748b; font-weight: bold;">MANUAL 8-JOINT SLIDERS</small>
                
                <div class="slider-row">
                    <div class="slider-head"><span>FL Coxa (J0)</span><span id="v0">90°</span></div>
                    <input type="range" min="10" max="170" value="90" id="s0" oninput="updateSliders()">
                </div>
                <div class="slider-row">
                    <div class="slider-head"><span>FL Femur (J1)</span><span id="v1">90°</span></div>
                    <input type="range" min="10" max="170" value="90" id="s1" oninput="updateSliders()">
                </div>

                <div class="slider-row">
                    <div class="slider-head"><span>FR Coxa (J2)</span><span id="v2">90°</span></div>
                    <input type="range" min="10" max="170" value="90" id="s2" oninput="updateSliders()">
                </div>
                <div class="slider-row">
                    <div class="slider-head"><span>FR Femur (J3)</span><span id="v3">90°</span></div>
                    <input type="range" min="10" max="170" value="90" id="s3" oninput="updateSliders()">
                </div>

                <div class="slider-row">
                    <div class="slider-head"><span>BL Coxa (J4)</span><span id="v4">90°</span></div>
                    <input type="range" min="10" max="170" value="90" id="s4" oninput="updateSliders()">
                </div>
                <div class="slider-row">
                    <div class="slider-head"><span>BL Femur (J5)</span><span id="v5">90°</span></div>
                    <input type="range" min="10" max="170" value="90" id="s5" oninput="updateSliders()">
                </div>

                <div class="slider-row">
                    <div class="slider-head"><span>BR Coxa (J6)</span><span id="v6">90°</span></div>
                    <input type="range" min="10" max="170" value="90" id="s6" oninput="updateSliders()">
                </div>
                <div class="slider-row">
                    <div class="slider-head"><span>BR Femur (J7)</span><span id="v7">90°</span></div>
                    <input type="range" min="10" max="170" value="90" id="s7" oninput="updateSliders()">
                </div>
            </div>

            <div class="fk-box">
                <strong>FK Foot Position Telemetry (mm):</strong>
                <div id="fkTelemetry">Calculating...</div>
            </div>
        </div>
    </div>

    <!-- Vendor Dependencies (100% Offline) -->
    <script src="../js/three.min.js"></script>
    <script src="../js/OrbitControls.js"></script>
    <script src="../js/RobotKinematics.js"></script>
    <script src="../js/RobotModel.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvasContainer');
            RobotModel.initScene(container);
            applyPreset('STAND');
        });

        function updateSliders() {
            const angles = [];
            for (let i = 0; i < 8; i++) {
                const val = parseInt(document.getElementById(`s${i}`).value);
                document.getElementById(`v${i}`).textContent = `${val}°`;
                angles.push(val);
            }
            RobotModel.setJointAngles(angles);
            updateFKDisplay(angles);
        }

        function applyPreset(pose) {
            let angles = [90, 90, 90, 90, 90, 90, 90, 90];
            if (pose === 'STAND') {
                const ik = RobotKinematics.solveLegIK(60, 0, -40);
                angles = [ik.coxa, ik.femur, ik.coxa, ik.femur, ik.coxa, ik.femur, ik.coxa, ik.femur];
            } else if (pose === 'REST') {
                angles = [90, 30, 90, 30, 90, 30, 90, 30];
            } else if (pose === 'SIT') {
                angles = [90, 110, 90, 110, 90, 30, 90, 30];
            } else if (pose === 'WAVE') {
                angles = [90, 90, 45, 150, 90, 80, 90, 80];
            }

            for (let i = 0; i < 8; i++) {
                document.getElementById(`s${i}`).value = Math.round(angles[i]);
                document.getElementById(`v${i}`).textContent = `${Math.round(angles[i])}°`;
            }
            RobotModel.setJointAngles(angles);
            updateFKDisplay(angles);
        }

        function updateFKDisplay(angles) {
            const names = ['FL', 'FR', 'BL', 'BR'];
            let html = '';
            for (let i = 0; i < 4; i++) {
                const coxa = angles[i * 2];
                const femur = angles[i * 2 + 1];
                const fk = RobotKinematics.solveLegFK(coxa, femur);
                html += `<div><strong>${names[i]}:</strong> (${fk.x.toFixed(1)}, ${fk.y.toFixed(1)}, ${fk.z.toFixed(1)})</div>`;
            }
            document.getElementById('fkTelemetry').innerHTML = html;
        }
    </script>
</body>
</html>
