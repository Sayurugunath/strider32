<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strider32 3D Gait Simulation Test Harness</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #e2e8f0;
            --border-color: #1e293b;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
        }

        body {
            font-family: 'JetBrains Mono', monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--cyan);
            font-size: 1.25rem;
            margin: 0;
        }

        .layout-container {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        .viewport-box {
            flex: 1;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        #canvasContainer {
            width: 100%;
            height: 100%;
        }

        .sidebar-box {
            width: 360px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            background-color: #1e293b;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-cyan { background-color: var(--cyan); color: #000; border: none; }
        .btn-emerald { background-color: var(--emerald); color: #000; border: none; }
        .btn-danger { background-color: var(--rose); color: #fff; border: none; }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 200px;
            margin: 0 auto;
        }

        .telemetry-card {
            background-color: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.75rem;
            line-height: 1.5;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .badge-swing { background-color: rgba(6, 182, 212, 0.2); color: var(--cyan); border: 1px solid var(--cyan); }
        .badge-stance { background-color: rgba(16, 185, 129, 0.2); color: var(--emerald); border: 1px solid var(--emerald); }
    </style>
</head>
<body>

    <header>
        <h1>Strider32 3D Gait Simulation Verification Test</h1>
        <div>
            <span id="gaitBadge" class="badge badge-stance">TROT GAIT</span>
            <span id="playBadge" class="badge badge-swing">PAUSED</span>
        </div>
    </header>

    <div class="layout-container">
        <div class="viewport-box">
            <div id="canvasContainer"></div>
        </div>

        <div class="sidebar-box">
            <div>
                <small style="color: #64748b; font-weight: bold;">SIMULATION CLOCK CONTROLS</small>
                <div class="btn-group" style="margin-top: 8px;">
                    <button class="btn btn-emerald" id="playBtn" onclick="togglePlay()">▶ Play</button>
                    <button class="btn" onclick="stepOnce()">Step Frame</button>
                    <button class="btn btn-danger" onclick="resetSim()">Reset</button>
                </div>
            </div>

            <div>
                <small style="color: #64748b; font-weight: bold;">GAIT SELECTOR</small>
                <div class="btn-group" style="margin-top: 8px;">
                    <button class="btn btn-cyan" id="trotBtn" onclick="selectGait('TROT')">TROT (2-Pair)</button>
                    <button class="btn" id="crawlBtn" onclick="selectGait('CRAWL')">CRAWL (4-Phase)</button>
                </div>
            </div>

            <div>
                <small style="color: #64748b; font-weight: bold;">DIRECTIONAL MOTION MATRIX</small>
                <div class="dpad-grid" style="margin-top: 8px;">
                    <div></div>
                    <button class="btn" onclick="sendMotion(1.0, 0, 0)">▲ Fwd</button>
                    <div></div>
                    
                    <button class="btn" onclick="sendMotion(0, -1.0, 0)">◄ Left</button>
                    <button class="btn btn-danger" onclick="sendMotion(0, 0, 0)">■ Stop</button>
                    <button class="btn" onclick="sendMotion(0, 1.0, 0)">Right ►</button>
                    
                    <div></div>
                    <button class="btn" onclick="sendMotion(-1.0, 0, 0)">▼ Back</button>
                    <div></div>
                </div>

                <div class="btn-group" style="margin-top: 8px; justify-content: center;">
                    <button class="btn" onclick="sendMotion(0, 0, -1.0)">Turn L ↺</button>
                    <button class="btn" onclick="sendMotion(0, 0, 1.0)">Turn R ↻</button>
                </div>
            </div>

            <div class="telemetry-card">
                <strong>Gait Phase & Leg Telemetry:</strong>
                <div id="telemetryBox">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Vendor Dependencies & Motion Engine -->
    <script src="../js/three.min.js"></script>
    <script src="../js/OrbitControls.js"></script>
    <script src="../js/RobotKinematics.js"></script>
    <script src="../js/RobotModel.js"></script>
    <script src="../js/GaitSimulator.js"></script>

    <script>
        let lastFrameTime = performance.now();

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvasContainer');
            RobotModel.initScene(container);
            GaitSimulator.init();
            
            requestAnimationFrame(simAnimationLoop);
        });

        function simAnimationLoop(now) {
            requestAnimationFrame(simAnimationLoop);

            const dt = (now - lastFrameTime) / 1000.0;
            lastFrameTime = now;

            if (GaitSimulator.state.isPlaying) {
                GaitSimulator.stepFrame(dt);
            }
            updateTelemetryDisplay();
        }

        function togglePlay() {
            GaitSimulator.togglePlay();
            document.getElementById('playBtn').textContent = GaitSimulator.state.isPlaying ? '❚❚ Pause' : '▶ Play';
            document.getElementById('playBadge').textContent = GaitSimulator.state.isPlaying ? 'RUNNING' : 'PAUSED';
        }

        function stepOnce() {
            GaitSimulator.pause();
            GaitSimulator.stepFrame(0.033);
            document.getElementById('playBtn').textContent = '▶ Play';
            document.getElementById('playBadge').textContent = 'STEP';
        }

        function resetSim() {
            GaitSimulator.reset();
            document.getElementById('playBtn').textContent = '▶ Play';
            document.getElementById('playBadge').textContent = 'RESET';
        }

        function selectGait(gait) {
            GaitSimulator.setGait(gait);
            document.getElementById('trotBtn').className = (gait === 'TROT') ? 'btn btn-cyan' : 'btn';
            document.getElementById('crawlBtn').className = (gait === 'CRAWL') ? 'btn btn-cyan' : 'btn';
            document.getElementById('gaitBadge').textContent = `${gait} GAIT`;
        }

        function sendMotion(fwd, lat, turn) {
            GaitSimulator.setMotionCommand(fwd, lat, turn);
            if (!GaitSimulator.state.isPlaying && (fwd !== 0 || lat !== 0 || turn !== 0)) {
                togglePlay();
            }
        }

        function updateTelemetryDisplay() {
            const telem = GaitSimulator.getTelemetry();
            const box = document.getElementById('telemetryBox');

            let html = `
                <div><strong>Phase:</strong> ${telem.phasePercent}% | <strong>Gait:</strong> ${telem.activeGait}</div>
                <hr style="border-color: #1e293b; margin: 6px 0;">
            `;

            ['FL', 'FR', 'BL', 'BR'].forEach(k => {
                const leg = telem.legs[k];
                const badgeClass = leg.state === 'SWING' ? 'badge-swing' : 'badge-stance';
                html += `
                    <div>
                        <strong>${k}:</strong> <span class="badge ${badgeClass}">${leg.state}</span>
                        Target: (${leg.target.x.toFixed(1)}, ${leg.target.y.toFixed(1)}, ${leg.target.z.toFixed(1)})
                        Angles: (${leg.angles.coxa.toFixed(1)}°, ${leg.angles.femur.toFixed(1)}°)
                    </div>
                `;
            });

            box.innerHTML = html;
        }
    </script>
</body>
</html>
